services:
  - type: web
    name: pavan-portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://portfolio-tan-eight-12.vercel.app,https://portfolio-pavanmannem-projects.vercel.app,https://portfolio-pavanmannem-projects-lhedmfq99.vercel.app
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: pavanmannem42@gmail.com
      - key: SMTP_FROM
        value: pavanmannem42@gmail.com
      - key: CONTACT_TO_EMAIL
        value: pavanmannem42@gmail.com
      - key: DATABASE_URL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
